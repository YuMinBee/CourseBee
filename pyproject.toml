[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coursebee-v3"
version = "3.0.0"
description = "Source-grounded onboarding reports, Q&A, and audio briefings from enterprise documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111,<1",
  "kiwipiepy>=0.21,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
pdf = ["Pillow>=10,<13", "PyMuPDF>=1.24,<2", "pytesseract>=0.3.13,<1"]
semantic = ["sentence-transformers>=5.6,<6"]
tts = ["edge-tts>=7.0,<8"]
dev = ["build>=1.2,<2", "httpx>=0.27,<1", "ruff>=0.5,<1"]
e2e = ["playwright>=1.49,<2"]

[project.scripts]
coursebee = "v2.cli:main"

[tool.setuptools.packages.find]
include = ["v2*"]

[tool.setuptools.package-data]
v2 = ["prompts/*.txt", "assets/*.html", "assets/demo_fixtures/*.txt"]

[tool.ruff]
target-version = "py310"
line-length = 120
# 외부에서 작성된 벤치마크 데이터와 그 검증 스크립트는 원본 그대로 둔다.
extend-exclude = ["eval/ragbench"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
